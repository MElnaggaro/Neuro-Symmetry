[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "neuro-symmetry-v2"
version     = "0.1.0"
description = "Multimodal Neurological Signal Detection Engine"
requires-python = ">=3.11"

dependencies = [
    # Backend
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "pydantic-settings>=2.3",

    # Vision
    "mediapipe>=0.10",
    "opencv-python>=4.9",

    # AI / numeric
    "torch>=2.3",
    "torchvision>=0.18",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "scipy>=1.13",

    # Data
    "Pillow>=10.3",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",       # test FastAPI
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version      = "3.11"
strict              = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
