services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.v2
    ports:
      - "8000:8000"
    environment:
      NS_LOG_LEVEL: INFO
      # pydantic-settings 2.7+ requires JSON-array syntax for list[str] fields
      NS_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      # Override model artifacts without rebuilding the image
      - ./ai/checkpoints:/app/ai/checkpoints:ro
      - ./backend/models:/app/backend/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Vite proxy target — routes /api and /ws to the backend container
      VITE_BACKEND_URL: "http://backend:8000"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
