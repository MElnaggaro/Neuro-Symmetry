<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FaceJoypad — Neuro-Symmetry</title>
  <link rel="stylesheet" href="shared.css"/>
  <style>
    body { overflow: hidden; }

    /* ── Main layout ───────────────────────────────────────────────────── */
    #app { flex: 1; display: flex; gap: 0; overflow: hidden; }

    /* ── Game canvas ───────────────────────────────────────────────────── */
    #game-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: .75rem;
      gap: .75rem;
    }
    #game-canvas {
      border-radius: .75rem;
      border: 2px solid var(--border);
      background: #0a1020;
      image-rendering: pixelated;
      max-width: 100%;
    }

    /* ── Sidebar ───────────────────────────────────────────────────────── */
    #sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sbar-section { padding: .75rem; border-bottom: 1px solid var(--border); }
    .sbar-title {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .15em;
      color: var(--muted);
      margin-bottom: .5rem;
    }

    /* Camera preview */
    #cam-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: .5rem;
      overflow: hidden;
      background: #000;
    }
    #cam-video   { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #cam-overlay { position: absolute; inset: 0; pointer-events: none; }
    #cam-error   {
      position: absolute; inset: 0;
      display: none;
      align-items: center; justify-content: center;
      background: rgba(15,23,42,.9);
      color: var(--red);
      font-size: .7rem;
      text-align: center;
      padding: .5rem;
    }

    /* Control indicators */
    .ctrl-item { display: flex; align-items: center; gap: .5rem; padding: .35rem 0; }
    .ctrl-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--border);
      flex-shrink: 0;
      transition: all .1s;
    }
    .ctrl-dot.on           { background: var(--cyan);  border-color: var(--cyan);  box-shadow: 0 0 6px var(--cyan); }
    .ctrl-dot.on.shield    { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 6px var(--amber); }
    .ctrl-dot.on.smile     { background: var(--green); border-color: var(--green); box-shadow: 0 0 6px var(--green); }
    .ctrl-label            { font-size: .72rem; color: var(--muted); line-height: 1.3; }
    .ctrl-label strong     { color: var(--txt); font-size: .7rem; }

    /* Session stats */
    .stat-row { display: flex; justify-content: space-between; margin-bottom: .35rem; }
    .stat-key  { font-size: .7rem; color: var(--muted); }
    .stat-val  { font-size: .7rem; color: var(--cyan); font-weight: 700; font-variant-numeric: tabular-nums; }

    /* Affected side picker */
    .side-row { display: flex; gap: .4rem; }

    /* Sidebar buttons */
    .btn { width: 100%; padding: .55rem; }

    /* ── Game over overlay ─────────────────────────────────────────────── */
    #gameover {
      position: absolute; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10,16,32,.88);
      border-radius: .75rem;
      gap: .875rem;
      padding: 1.25rem;
      text-align: center;
    }
    #gameover.show  { display: flex; }
    #gameover h2    { font-size: 1.3rem; color: var(--cyan); letter-spacing: .1em; }
    #gameover .go-score { font-size: 2rem; font-weight: 800; color: var(--txt); }
    #gameover .go-stat  { font-size: .8rem; color: var(--muted); }
    #gameover .go-prog  {
      font-size: .875rem;
      padding: .5rem .875rem;
      background: rgba(34,211,238,.1);
      border: 1px solid rgba(34,211,238,.25);
      border-radius: .5rem;
      color: var(--cyan);
    }

    @media (max-width: 600px) { #sidebar { width: 160px; } }
  </style>
</head>

    <div class="sbar-section">

      <div class="stat-row"><span class="stat-key">Smiles</span>       <span class="stat-val" id="stat-smile">0</span></div>
      <div class="stat-row"><span class="stat-key">Cheek puffs</span>  <span class="stat-val" id="stat-puff">0</span></div>
      <div class="stat-row"><span class="stat-key">Combos (2×)</span>  <span class="stat-val" id="stat-combos" style="color:#f59e0b">0</span></div>
      <div class="stat-row"><span class="stat-key">Score</span>        <span class="stat-val" id="stat-score">0</span></div>
    </div>

    <div class="sbar-section">
      <button class="btn btn-primary" id="start-btn">START GAME</button>

    </div>

  </aside>
</div>

<script src="shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>

<script>
"use strict";

/* ════════════════════════════════════════════════════════════════════════════
   FACE CONTROL SYSTEM
   ════════════════════════════════════════════════════════════════════════════ */

/* MediaPipe landmark indices — image-space ("R" = image-right = bio LEFT) */
const LM = {
  R_EYE_OUTER:   33,
  L_EYE_OUTER:  263,
  R_EYE_TOP:    159,
  L_EYE_TOP:    386,
  R_BROW_OUTER:  70,
  L_BROW_OUTER: 300,
  MOUTH_L:       61,
  MOUTH_R:      291,
  CHEEK_L:      234,
  CHEEK_R:      454,
  NOSE_TOP:      10,
  CHIN:         152,
};

let trainSide = "LEFT";

const baseline = {
  rBrowLift: 0, lBrowLift: 0,
  smileW:    0, cheekW:    0,
  n:         0, ready:     false,
};
const BASELINE_FRAMES = 45;

const hold = {
  browStart:    null,
  HOLD_MS:      3000,
  comboActive:  false,
  comboEnd:     0,
  COMBO_MULT:   2,
  COMBO_DUR_MS: 5000,
};

const ctrl = {
  brow:  false, smile: false, puff: false,
  lastBrow: 0, lastSmile: 0, lastPuff: 0,
  COOLDOWN: 600,
};

const session = { brow: 0, smile: 0, puff: 0, combos: 0 };

let baselineFrames = 0;
let lmsReady = false;

/* ── Baseline update ───────────────────────────────────────────────────────── */
function updateBaseline(L) {
  baseline.rBrowLift += L[LM.R_EYE_TOP].y - L[LM.R_BROW_OUTER].y;
  baseline.lBrowLift += L[LM.L_EYE_TOP].y - L[LM.L_BROW_OUTER].y;
  baseline.smileW    += Math.abs(L[LM.MOUTH_R].x - L[LM.MOUTH_L].x);
  baseline.cheekW    += Math.abs(L[LM.CHEEK_R].x - L[LM.CHEEK_L].x);
  baseline.n++;
  if (baseline.n >= BASELINE_FRAMES) baseline.ready = true;
}

/* ── Per-frame control computation ────────────────────────────────────────── */
function computeControls(L, now) {
  if (!baseline.ready) return;
  const n = baseline.n;

  const rLift = L[LM.R_EYE_TOP].y - L[LM.R_BROW_OUTER].y;
  const lLift = L[LM.L_EYE_TOP].y - L[LM.L_BROW_OUTER].y;
  const trackedLift = trainSide === "LEFT"  ? rLift :
                      trainSide === "RIGHT" ? lLift :
                      Math.min(rLift, lLift);
  const trackedBase = trainSide === "LEFT"  ? baseline.rBrowLift / n :
                      trainSide === "RIGHT" ? baseline.lBrowLift / n :
                      Math.min(baseline.rBrowLift, baseline.lBrowLift) / n;

  const browRaised = trackedLift > trackedBase * 1.25;

  if (browRaised) {
    if (!hold.browStart) hold.browStart = now;
    const elapsed = now - hold.browStart;
    if (elapsed >= hold.HOLD_MS && !hold.comboActive) {
      hold.comboActive = true;
      hold.comboEnd    = now + hold.COMBO_DUR_MS;
      hold.browStart   = null;
      session.combos++;
      comboBurst(player.x + player.w / 2, player.y);
      awardScore(50);
    }
  } else {
    hold.browStart = null;
  }
  if (hold.comboActive && now > hold.comboEnd) hold.comboActive = false;

  const mW = Math.abs(L[LM.MOUTH_R].x - L[LM.MOUTH_L].x);
  const cW = Math.abs(L[LM.CHEEK_R].x - L[LM.CHEEK_L].x);
  const smWBase = baseline.smileW / n;
  const chWBase = baseline.cheekW / n;
  const smiling = mW > smWBase * 1.18;
  const puffed  = cW > chWBase * 1.06 && mW > smWBase * 1.10;

  if (browRaised && !ctrl.brow && now - ctrl.lastBrow > ctrl.COOLDOWN) {
    ctrl.brow = true; ctrl.lastBrow = now;
    session.brow++;
    gameFireBrow();
  } else if (!browRaised) {
    ctrl.brow = false;
  }

  if (smiling && !ctrl.smile && now - ctrl.lastSmile > ctrl.COOLDOWN) {
    ctrl.smile = true; ctrl.lastSmile = now;
    session.smile++;
    gameFireSmile();
  } else if (!smiling) {
    ctrl.smile = false;
  }

  if (puffed && !ctrl.puff && now - ctrl.lastPuff > ctrl.COOLDOWN * 2) {
    ctrl.puff = true; ctrl.lastPuff = now;
    session.puff++;
    gameFirePuff();
  } else if (!puffed) {
    ctrl.puff = false;
  }

  document.getElementById("dot-brow").classList.toggle("on",  ctrl.brow);
  document.getElementById("dot-smile").classList.toggle("on", ctrl.smile);
  document.getElementById("dot-puff").classList.toggle("on",  ctrl.puff);
  updateHoldUI(now);
}

/* ── Hold progress ring UI ─────────────────────────────────────────────────── */
function updateHoldUI(now) {
  const ring  = document.getElementById("hold-ring");
  const label = document.getElementById("hold-label");
  const combo = document.getElementById("combo-badge");
  if (!ring) return;
  const CIRC = 2 * Math.PI * 18;

  if (hold.comboActive) {
    const remaining = Math.max(0, hold.comboEnd - now);
    const pct = remaining / hold.COMBO_DUR_MS;
    ring.style.strokeDashoffset = ((1 - pct) * CIRC).toFixed(1);
    ring.style.stroke = "#f59e0b";
    label.textContent = "2×";
    label.style.fill  = "#f59e0b";
    combo.style.display = "block";
  } else if (hold.browStart) {
    const pct = Math.min(1, (now - hold.browStart) / hold.HOLD_MS);
    ring.style.strokeDashoffset = ((1 - pct) * CIRC).toFixed(1);
    ring.style.stroke = "#22d3ee";
    label.textContent = pct >= 1 ? "!" : Math.ceil((1 - pct) * 3) + "s";
    label.style.fill  = "#22d3ee";
    combo.style.display = "block";
  } else {
    ring.style.strokeDashoffset = CIRC;
    combo.style.display = "none";
  }
}

/* ── MediaPipe ─────────────────────────────────────────────────────────────── */
function onFaceResults(results) {
  const ov  = document.getElementById("cam-overlay");
  const ctx = ov.getContext("2d");
  ctx.clearRect(0, 0, ov.width, ov.height);

  if (!results.multiFaceLandmarks || !results.multiFaceLandmarks.length) return;
  const raw = results.multiFaceLandmarks[0];
  const L   = normalizeRawLandmarks(raw, document.getElementById("cam-video"));  // shared.js
  if (!L) return;

  ctx.fillStyle = "rgba(34,211,238,.5)";
  for (const pt of raw) {
    ctx.beginPath();
    ctx.arc((1 - pt.x) * ov.width, pt.y * ov.height, 1.1, 0, Math.PI * 2);
    ctx.fill();
  }

  if (baselineFrames < BASELINE_FRAMES) {
    updateBaseline(L);
    baselineFrames++;
  } else {
    computeControls(L, performance.now());
  }
  lmsReady = true;
}

async function initCamera() {
  const video   = document.getElementById("cam-video");
  const overlay = document.getElementById("cam-overlay");
  const errDiv  = document.getElementById("cam-error");

  video.addEventListener("loadedmetadata", () => {
    overlay.width  = video.videoWidth;
    overlay.height = video.videoHeight;
  }, { once: true });

  try {
    const faceMesh = createFaceMesh();  // shared.js
    faceMesh.onResults(onFaceResults);

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: "user" },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();

    let processing = false;
    requestAnimationFrame(async function cameraLoop() {
      if (!processing && video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        processing = true;
        try { await faceMesh.send({ image: video }); } finally { processing = false; }
      }
      requestAnimationFrame(cameraLoop);
    });
  } catch (err) {
    errDiv.style.display = "flex";
    errDiv.textContent = err.name === "NotAllowedError"
      ? "Camera denied. Use keyboard: ↑ Jump  Z Smile  X Shield"
      : "Camera unavailable. Use ↑ Jump  Z Smile  X Shield";
  }
}

/* ════════════════════════════════════════════════════════════════════════════
   GAME ENGINE
   ════════════════════════════════════════════════════════════════════════════ */

const GC     = document.getElementById("game-canvas");
const GX     = GC.getContext("2d");
const GW     = GC.width;
const GH     = GC.height;
const GROUND = GH - 48;

/* Precomputed hex → RGB channel strings for the HUD bar (avoids per-frame parsing) */
const _HEX_RGB = { "#22d3ee": "34,211,238", "#34d399": "52,211,153", "#f59e0b": "245,158,11" };

let gameState = "idle";
let lastTs    = 0;
let frameId   = null;

const player = {
  x: 90, y: GROUND, vy: 0,
  w: 34, h: 34,
  jumping: false, shielded: false, shieldEnd: 0, boosted: false, boostEnd: 0, alive: true,
};

let obstacles  = [];
let coins      = [];
let particles  = [];
let bgStars    = [];
let score      = 0;
let speed      = 3.5;
let spawnTimer = 0;
let coinTimer  = 0;
const GRAVITY  = 0.55;
const JUMP_V   = -12;

let difficulty     = 1;
let lastDifficulty = 0;
let activationEase = 0;

function initBg() {
  bgStars = [];
  for (let i = 0; i < 60; i++) {
    bgStars.push({ x: Math.random() * GW, y: Math.random() * GROUND * 0.85, r: Math.random() * 1.2 + 0.3, spd: Math.random() * 0.4 + 0.1 });
  }
}

function initGame() {
  Object.assign(player, { x: 90, y: GROUND, vy: 0, jumping: false, shielded: false, boosted: false, alive: true });
  obstacles  = []; coins = []; particles = [];
  score      = 0;  speed = 3.5;
  spawnTimer = 0;  coinTimer = 0;
  difficulty = 1;  lastDifficulty = 0;
  Object.assign(session,  { brow: 0, smile: 0, puff: 0, combos: 0 });
  Object.assign(hold,     { browStart: null, comboActive: false, comboEnd: 0 });
  updateStatUI();
  initBg();
}

function spawnObstacle() {
  const h = 20 + Math.random() * 30 * difficulty;
  const w = 18 + Math.random() * 14;
  obstacles.push({ x: GW + 10, y: GROUND - h + player.h, w, h });
}

function spawnCoin() {
  const altitudes = [GROUND - 60, GROUND - 100, GROUND - 140];
  const y = altitudes[Math.floor(Math.random() * altitudes.length)];
  coins.push({ x: GW + 10, y, r: 8, collected: false });
}

function burst(x, y, col, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.4;
    const spd = 2 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 2, life: 1, col });
  }
}

function comboBurst(x, y) {
  burst(x, y,     "#f59e0b", 18);
  burst(x, y + 8, "#22d3ee", 14);
}

function awardScore(points) {
  score += points * (hold.comboActive ? hold.COMBO_MULT : 1);
}

function gameFireBrow() {
  if (gameState !== "playing" || !player.alive) return;
  if (!player.jumping) {
    player.vy = JUMP_V; player.jumping = true;
    burst(player.x + player.w / 2, player.y, "#22d3ee", 6);
    awardScore(2);
    activationEase = Math.min(10, activationEase + 1);
  }
}

function gameFireSmile() {
  if (gameState !== "playing" || !player.alive) return;
  player.boosted = true; player.boostEnd = performance.now() + 1500;
  burst(player.x + player.w / 2, player.y + player.h / 2, "#34d399", 10);
  awardScore(5);
  coins.forEach((c) => {
    if (!c.collected && Math.abs(c.x - player.x) < 80) {
      c.collected = true; burst(c.x, c.y, "#f59e0b", 5); awardScore(10);
    }
  });
  activationEase = Math.min(10, activationEase + 1);
}

function gameFirePuff() {
  if (gameState !== "playing" || !player.alive) return;
  player.shielded = true; player.shieldEnd = performance.now() + 2000;
  burst(player.x + player.w / 2, player.y + player.h / 2, "#f59e0b", 12);
  awardScore(3);
  activationEase = Math.min(10, activationEase + 1);
}

document.addEventListener("keydown", (e) => {
  if (e.code === "ArrowUp" || e.code === "Space") { e.preventDefault(); gameFireBrow(); }
  if (e.code === "KeyZ") gameFireSmile();
  if (e.code === "KeyX") gameFirePuff();
  if (e.code === "KeyP") togglePause();
});

function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function update(dt) {
  if (gameState !== "playing" || !player.alive) return;
  const now = performance.now();
  const spd = player.boosted && now < player.boostEnd ? speed * 1.8 : speed;

  player.vy += GRAVITY; player.y += player.vy;
  if (player.y >= GROUND) { player.y = GROUND; player.vy = 0; player.jumping = false; }

  if (player.shielded && now > player.shieldEnd) player.shielded = false;
  if (player.boosted  && now > player.boostEnd)  player.boosted  = false;

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = (1200 - difficulty * 80) / spd + Math.random() * 400;
  }
  obstacles.forEach((o) => { o.x -= spd; });
  obstacles = obstacles.filter((o) => o.x > -60);

  coinTimer -= dt;
  if (coinTimer <= 0) { spawnCoin(); coinTimer = 900 + Math.random() * 600; }
  coins.forEach((c) => { c.x -= spd * 0.9; });
  coins = coins.filter((c) => c.x > -20);

  particles.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.035; });
  particles = particles.filter((p) => p.life > 0);

  bgStars.forEach((s) => { s.x -= s.spd; if (s.x < 0) s.x = GW + 2; });

  const mult = hold.comboActive ? hold.COMBO_MULT : 1;
  score += spd * 0.012 * mult;
  if (score - lastDifficulty > 500) {
    difficulty = Math.min(5, difficulty + 1);
    speed = Math.min(8, speed + 0.4);
    lastDifficulty += 500;
  }
  updateStatUI();

  coins.forEach((c) => {
    if (!c.collected && aabb(player.x, player.y, player.w, player.h, c.x - c.r, c.y - c.r, c.r * 2, c.r * 2)) {
      c.collected = true; burst(c.x, c.y, "#f59e0b", 5); awardScore(10);
    }
  });

  if (!player.shielded) {
    for (const o of obstacles) {
      if (aabb(player.x + 4, player.y + 4, player.w - 8, player.h - 8, o.x, o.y, o.w, o.h)) {
        triggerGameOver(); return;
      }
    }
  }
}

function render() {
  GX.clearRect(0, 0, GW, GH);

  const sky = GX.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, "#050d1a"); sky.addColorStop(1, "#0a1828");
  GX.fillStyle = sky; GX.fillRect(0, 0, GW, GH);

  bgStars.forEach((s) => {
    GX.fillStyle = `rgba(148,163,184,${0.3 + s.r * 0.2})`;
    GX.beginPath(); GX.arc(s.x, s.y, s.r, 0, Math.PI * 2); GX.fill();
  });

  GX.fillStyle = "#1e3a52";
  GX.fillRect(0, GROUND + player.h - 2, GW, GH - GROUND - player.h + 2);
  GX.strokeStyle = "#22d3ee"; GX.lineWidth = 1.5;
  GX.beginPath(); GX.moveTo(0, GROUND + player.h - 2); GX.lineTo(GW, GROUND + player.h - 2); GX.stroke();

  GX.fillStyle = "rgba(34,211,238,.7)"; GX.font = "bold 11px monospace";
  GX.fillText("SCORE " + Math.floor(score), 12, 20);
  GX.fillStyle = "rgba(100,116,139,.6)"; GX.font = "9px monospace";
  GX.fillText("DIFFICULTY " + difficulty, 12, 34);

  coins.filter((c) => !c.collected).forEach((c) => {
    GX.save();
    GX.shadowColor = "#f59e0b"; GX.shadowBlur = 8;
    GX.fillStyle = "#f59e0b";
    GX.beginPath(); GX.arc(c.x, c.y, c.r, 0, Math.PI * 2); GX.fill();
    GX.fillStyle = "#fff8"; GX.font = "bold 9px monospace";
    GX.textAlign = "center"; GX.textBaseline = "middle";
    GX.fillText("✦", c.x, c.y);
    GX.textAlign = "left"; GX.textBaseline = "alphabetic";
    GX.restore();
  });

  obstacles.forEach((o) => {
    GX.fillStyle = "#e74c3c"; GX.fillRect(o.x, o.y, o.w, o.h);
    GX.strokeStyle = "#f87171"; GX.lineWidth = 1; GX.strokeRect(o.x, o.y, o.w, o.h);
    GX.strokeStyle = "rgba(255,255,255,.25)"; GX.lineWidth = 1.5;
    GX.beginPath(); GX.moveTo(o.x + 3, o.y + 3); GX.lineTo(o.x + o.w - 3, o.y + o.h - 3); GX.stroke();
    GX.beginPath(); GX.moveTo(o.x + o.w - 3, o.y + 3); GX.lineTo(o.x + 3, o.y + o.h - 3); GX.stroke();
  });

  particles.forEach((p) => {
    GX.globalAlpha = p.life; GX.fillStyle = p.col;
    GX.beginPath(); GX.arc(p.x, p.y, 3, 0, Math.PI * 2); GX.fill();
  });
  GX.globalAlpha = 1;

  const px = player.x, py = player.y, pw = player.w, ph = player.h;
  const cx_ = px + pw / 2, cy_ = py + ph / 2;
  const now = performance.now();

  if (player.shielded) {
    GX.save();
    GX.shadowColor = "#f59e0b"; GX.shadowBlur = 18;
    GX.strokeStyle = "rgba(245,158,11,.6)"; GX.lineWidth = 3;
    GX.beginPath(); GX.arc(cx_, cy_, pw * 0.7, 0, Math.PI * 2); GX.stroke();
    GX.restore();
  }

  const headColor = player.boosted ? "#34d399" : player.shielded ? "#f59e0b" : "#22d3ee";
  GX.save();
  GX.shadowColor = headColor; GX.shadowBlur = 10;
  GX.fillStyle = "#0a1828"; GX.strokeStyle = headColor; GX.lineWidth = 2;
  GX.beginPath(); GX.arc(cx_, cy_, pw * 0.45, 0, Math.PI * 2); GX.fill(); GX.stroke();
  GX.restore();

  const eyeY = cy_ - ph * 0.08, eyeOff = pw * 0.13;
  const eyeH = player.jumping ? 0.5 : 3.5;
  GX.fillStyle = headColor;
  GX.fillRect(cx_ - eyeOff - 2, eyeY - eyeH / 2, 4, eyeH);
  GX.fillRect(cx_ + eyeOff - 2, eyeY - eyeH / 2, 4, eyeH);

  const smileW = player.boosted ? pw * 0.30 : pw * 0.20;
  GX.strokeStyle = headColor; GX.lineWidth = 1.5;
  GX.beginPath(); GX.arc(cx_, cy_ + ph * 0.10, smileW, 0, Math.PI); GX.stroke();

  /* Controls HUD bar — colors precomputed to avoid per-frame hex parsing */
  const barY = GH - 20;
  const ctrlItems = [
    { key: "↑ JUMP",   active: ctrl.brow,  col: "#22d3ee" },
    { key: "Z BOOST",  active: ctrl.smile, col: "#34d399" },
    { key: "X SHIELD", active: ctrl.puff,  col: "#f59e0b" },
  ];
  ctrlItems.forEach(({ key, active, col }, i) => {
    const bx = 12 + i * 140;
    GX.fillStyle   = active ? `rgba(${_HEX_RGB[col]}, .2)` : "rgba(30,58,82,.4)";
    GX.fillRect(bx, barY - 12, 130, 16);
    GX.strokeStyle = active ? col : "rgba(30,58,82,.6)";
    GX.lineWidth   = 1;
    GX.strokeRect(bx, barY - 12, 130, 16);
    GX.fillStyle   = active ? col : "#64748b";
    GX.font        = "bold 9px monospace";
    GX.fillText(key, bx + 5, barY - 1);
  });
}

function updateStatUI() {
  document.getElementById("stat-brow").textContent   = session.brow;
  document.getElementById("stat-smile").textContent  = session.smile;
  document.getElementById("stat-puff").textContent   = session.puff;
  document.getElementById("stat-combos").textContent = session.combos;
  document.getElementById("stat-score").textContent  = Math.floor(score);
}

function triggerGameOver() {
  player.alive = false; gameState = "over";
  burst(player.x + player.w / 2, player.y + player.h / 2, "#f87171", 16);

  const history   = JSON.parse(localStorage.getItem(NS_KEYS.GAME) || "[]");
  const yesterday = history.length >= 2 ? history[history.length - 2] : null;
  const todayTotal = session.brow + session.smile + session.puff;

  history.push({ date: new Date().toISOString(), score: Math.floor(score), activations: todayTotal });
  if (history.length > 60) history.splice(0, history.length - 60);
  localStorage.setItem(NS_KEYS.GAME, JSON.stringify(history));

  const assessments = JSON.parse(localStorage.getItem(NS_KEYS.ASSESSMENTS) || "[]");
  assessments.push({ date: new Date().toISOString(), type: "game", score: Math.floor(score), game_activations: todayTotal });
  if (assessments.length > 500) assessments.splice(0, assessments.length - 500);
  localStorage.setItem(NS_KEYS.ASSESSMENTS, JSON.stringify(assessments));

  const progText = yesterday
    ? `Activations today: ${todayTotal} vs yesterday: ${yesterday.activations} — ${
        todayTotal > yesterday.activations
          ? "+" + (todayTotal - yesterday.activations) + " improvement!"
          : "Keep training!"
      }`
    : `Total nerve activations this session: ${todayTotal}`;

  document.getElementById("go-score").textContent = "SCORE " + Math.floor(score);
  document.getElementById("go-stat").textContent  = `Brow: ${session.brow}  Smile: ${session.smile}  Shield: ${session.puff}`;
  document.getElementById("go-prog").textContent  = progText;
  document.getElementById("gameover").classList.add("show");
}

function gameLoop(ts) {
  const dt = Math.min(32, ts - (lastTs || ts));
  lastTs = ts;
  update(dt); render();
  frameId = requestAnimationFrame(gameLoop);
}

function startGame() {
  initGame();
  document.getElementById("gameover").classList.remove("show");
  gameState = "playing";
  document.getElementById("start-btn").style.display = "none";
  document.getElementById("pause-btn").style.display = "block";
  if (!frameId) frameId = requestAnimationFrame(gameLoop);
}

function togglePause() {
  if (gameState === "playing") {
    gameState = "paused";
    document.getElementById("pause-btn").textContent = "RESUME";
  } else if (gameState === "paused") {
    gameState = "playing";
    document.getElementById("pause-btn").textContent = "PAUSE";
  }
}

document.getElementById("start-btn").addEventListener("click",  startGame);
document.getElementById("replay-btn").addEventListener("click", startGame);
document.getElementById("pause-btn").addEventListener("click",  togglePause);

/* Side selector — shared.js utility */
const setActivePill = wireSideSelector(".side-pill", (side) => {
  trainSide = side;
  Object.assign(baseline, { rBrowLift: 0, lBrowLift: 0, smileW: 0, cheekW: 0, n: 0, ready: false });
  baselineFrames = 0;
});

const stored = localStorage.getItem(NS_KEYS.AFFECTED_SIDE);
if (stored && ["LEFT", "RIGHT", "BOTH"].includes(stored)) {
  trainSide = stored;
  setActivePill(stored);
}

initGame();
render();
initCamera();
</script>
